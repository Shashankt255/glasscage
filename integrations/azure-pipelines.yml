# GLASSCAGE AI security scan for Azure DevOps
trigger: none
pool: { vmImage: ubuntu-latest }
steps:
  - task: UsePythonVersion@0
    inputs: { versionSpec: '3.11' }
  - script: python cli.py --config targets.json --authorized --adaptive --sarif --out glasscage_ci
    displayName: 'GLASSCAGE AI red-team'
  - publish: glasscage_ci.sarif
    artifact: glasscage-sarif
