# GLASSCAGE AI security scan -> GitHub code scanning (SARIF)
name: glasscage-ai-security
on: [workflow_dispatch, pull_request]
jobs:
  ai-red-team:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Run GLASSCAGE
        env: { TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }} }
        run: |
          python cli.py --config targets.json --authorized --adaptive \
            --schema schema.json --architecture arch.json \
            --sarif --out glasscage_ci
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: glasscage_ci.sarif }
