# Builds and tests on a version tag to gate the release.
# Artifacts are uploaded manually via `gh release create` with pre-built dist files.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - name: Install
        run: pip install -e .
      - name: Run full test suite (gate the release)
        run: python -m pytest -q
      - name: Lint
        run: |
          pip install ruff
          ruff check
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Generate SBOM
        run: python tools/gen_sbom.py > sbom.json
